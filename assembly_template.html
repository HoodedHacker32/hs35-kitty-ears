<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cat Ear Assembly</title>
<style>
  :root { --bg:#141416; --panel:#1d1d21f0; --fg:#ecebe8; --muted:#a3a19b; --line:#34343a; --acc:#f2a7c3; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .card { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; width:min(560px, calc(100% - 32px)); background:var(--panel);
          border:1px solid var(--line); border-radius:16px; padding:14px 16px 12px; backdrop-filter:blur(10px); box-sizing:border-box; }
  .step { color:var(--acc); font-size:12px; letter-spacing:.06em; text-transform:uppercase; }
  h1 { font-size:18px; margin:2px 0 4px; font-weight:600; }
  p { margin:0 0 10px; color:#d6d4cf; font-size:14px; }
  ul { margin:0 0 10px; padding-left:18px; color:#d6d4cf; font-size:14px; } li { margin:2px 0; }
  .row { display:flex; gap:8px; align-items:center; }
  button { background:#2a2a30; color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:8px 14px; font:inherit; font-size:14px; cursor:pointer; }
  button:hover { border-color:#5a5a64; } button:disabled { opacity:.4; cursor:default; }
  button.primary { background:#3a2a31; border-color:var(--acc); }
  .dots { display:flex; gap:6px; margin-left:auto; } .dot { width:8px; height:8px; border-radius:50%; background:#44444c; cursor:pointer; } .dot.on { background:var(--acc); }
  .top { position:fixed; top:14px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .top a { color:#e7e5e0; text-decoration:none; border:1px solid var(--line); border-radius:999px; padding:6px 12px; background:var(--panel); }
  #loading { position:fixed; inset:0; display:grid; place-items:center; color:var(--muted); }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Loading parts…</div>
<div class="top"><span>Cat ears for the Corsair HS35 v2: assembly guide</span><a href="./">3D viewer</a></div>
<div class="card">
  <div class="step" id="stepNo"></div>
  <h1 id="title"></h1>
  <div id="body"></div>
  <div class="row">
    <button id="prev">Back</button><button id="replay">Replay</button><button id="next" class="primary">Next</button>
    <div class="dots" id="dots"></div>
  </div>
</div>
<script id="meta" type="application/json">__META__</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { toCreasedNormals } from 'three/addons/utils/BufferGeometryUtils.js';

const META = JSON.parse(document.getElementById('meta').textContent);
const MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.95;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x141416); scene.fog = new THREE.Fog(0x141416, 900, 2200);
const pmrem = new THREE.PMREMGenerator(renderer);
{ // product-photography studio for reflections
  const s = new THREE.Scene(); s.background = new THREE.Color(0x060607);
  const panel = (w, h, pos, k) => { const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xffffff).multiplyScalar(k), side: THREE.DoubleSide })); m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m); };
  panel(70, 34, [0, 48, 12], 2.6); panel(9, 80, [-46, 6, 14], 5.0); panel(9, 80, [46, 6, -16], 3.6); panel(60, 8, [0, 12, -48], 2.2); panel(80, 30, [0, -46, 0], 0.18);
  scene.environment = pmrem.fromScene(s, 0.015).texture;
}
const cam = new THREE.PerspectiveCamera(32, 1, 1, 6000);
const ctl = new OrbitControls(cam, canvas); ctl.enableDamping = true; ctl.minDistance = 40; ctl.maxDistance = 1400;
const key = new THREE.DirectionalLight(0xfff4ea, 2.4); key.position.set(260, 520, 380); key.castShadow = true;
key.shadow.mapSize.set(MOBILE ? 2048 : 4096, MOBILE ? 2048 : 4096); key.shadow.bias = -0.0002; key.shadow.normalBias = 0.6;
Object.assign(key.shadow.camera, { left: -420, right: 420, top: 420, bottom: -420, near: 50, far: 1800 }); scene.add(key);
scene.add(new THREE.HemisphereLight(0xe8ecff, 0x2a2a30, 0.5));
const rim = new THREE.DirectionalLight(0xdfe8ff, 1.4); rim.position.set(-420, 260, -360); scene.add(rim);
const bounce = new THREE.DirectionalLight(0xffffff, 0.7); bounce.position.set(60, -400, 160); scene.add(bounce);

const world = new THREE.Group(); world.rotation.x = -Math.PI / 2; scene.add(world);   // authored Z-up, front = -Y
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const W2V = (x, y, z) => V(x, z, -y);

const M = {
  ear: new THREE.MeshPhysicalMaterial({ color: 0x26262a, roughness: 0.82, specularIntensity: 0.4, envMapIntensity: 0.6 }),
  clip: new THREE.MeshPhysicalMaterial({ color: 0x0b0b0c, roughness: 0.28, clearcoat: 0.15, envMapIntensity: 0.95 }),
  insert: new THREE.MeshPhysicalMaterial({ color: 0xe9b3c6, roughness: 0.82, envMapIntensity: 0.55 }),
  band: new THREE.MeshPhysicalMaterial({ color: 0x0d0d0f, roughness: 0.26, clearcoat: 0.6, clearcoatRoughness: 0.12, envMapIntensity: 0.85 }),
  anchor: new THREE.MeshPhysicalMaterial({ color: 0x121214, roughness: 0.7, envMapIntensity: 0.85 }),
  plate: new THREE.MeshPhysicalMaterial({ color: 0x2c2a26, roughness: 0.75, metalness: 0.3, envMapIntensity: 0.6 }),
  floor: new THREE.MeshStandardMaterial({ color: 0x0e0e10, roughness: 0.85 }),
  glue: new THREE.MeshPhysicalMaterial({ color: 0xeef6ff, roughness: 0.02, transmission: 0.6, thickness: 1, clearcoat: 1, envMapIntensity: 1.2 }),
  ring: new THREE.MeshBasicMaterial({ color: 0xf2a7c3, transparent: true, opacity: 0, depthWrite: false }),
};
const mk = (g, m, parent = world) => { const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; parent.add(o); return o; };
const floor = mk(new THREE.CircleGeometry(1400, 96), M.floor); floor.position.z = -351; floor.castShadow = false;
// Bambu-style 256 x 256 build plate
{ const s = new THREE.Shape(), r = 8, h = 128; s.moveTo(-h + r, -h); s.lineTo(h - r, -h); s.quadraticCurveTo(h, -h, h, -h + r); s.lineTo(h, h - r); s.quadraticCurveTo(h, h, h - r, h); s.lineTo(-h + r, h); s.quadraticCurveTo(-h, h, -h, h - r); s.lineTo(-h, -h + r); s.quadraticCurveTo(-h, -h, -h + r, -h);
  const p = mk(new THREE.ExtrudeGeometry(s, { depth: 2, bevelEnabled: false }), M.plate); p.position.set(META.plate[0], META.plate[1], META.plate[2] - 2); }

// ---------------------------------------------------------------- poses
const P = {}, POSE = {};
function pose(m4) { const p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3(); m4.decompose(p, q, s); return { p, q, s }; }
const AX = {}; for (const s of ['L', 'R']) AX[s] = META.axes[s].map(a => V(...a));   // clip-local X, Y, Z in world
const sideOf = n => n.slice(-1);
function offset(base, side, lx, ly, lz) {   // shift a pose along the clip's own axes (mm)
  const d = AX[side][0].clone().multiplyScalar(lx).add(AX[side][1].clone().multiplyScalar(ly)).add(AX[side][2].clone().multiplyScalar(lz));
  return { p: base.p.clone().add(d), q: base.q.clone(), s: base.s.clone() };
}
const HOVER = 72;
const fin = n => POSE[n].final, hov = (n, lx = 0, ly = 0, lz = 0) => offset(fin(n), sideOf(n), lx, ly, HOVER + lz);

// ---------------------------------------------------------------- steps
const PARTS = ['ear_L', 'insert_L', 'clip_L', 'ear_R', 'insert_R', 'clip_R'];
const STEPS = [
  { title: 'Print the parts', cam: [W2V(0, -650, -60), W2V(0, -300, -350)],
    body: `<ul><li><b>2 ears</b>: PLA, matte black. Lying on the flat back, no supports.</li><li><b>2 clips</b>: PETG, black. Standing on end, brim on, 4 walls.</li><li><b>2 inner ears</b>: PLA, pink. Flat.</li></ul>`,
    moves: [] },
  { title: 'Press the pink inner ear in', cam: [W2V(215, -235, 110), W2V(80, 0, 40)],
    body: `<p>Push the pink piece into the pocket at the front of the ear until it sits flat. Add a dab of glue if it's loose.</p>`,
    moves: [['ear_L', () => hov('ear_L'), 0, 1.4], ['insert_L', () => hov('insert_L', 0, -45, 0), 0, 1.4], ['insert_L', () => hov('insert_L'), 1.8, 1.0]] },
  { title: 'Slide the ear onto the clip', cam: [W2V(235, -255, 120), W2V(78, 0, 36)],
    body: `<p>Put a small drop of superglue on the clip's rail (optional, but it makes the ear permanent). Then slide the ear's groove onto the rail from the side until it's centred.</p>`,
    moves: [['clip_L', () => hov('clip_L'), 0, 1.4], ['ear_L', () => hov('ear_L', 85, 0, 0), 0, 1.0], ['insert_L', () => hov('insert_L', 85, 0, 0), 0, 1.0],
            ['glue', null, 1.3, 0.7], ['ear_L', () => hov('ear_L'), 2.1, 1.6], ['insert_L', () => hov('insert_L'), 2.1, 1.6]] },
  { title: 'Click it onto the headband', cam: [W2V(250, -285, 55), W2V(52, 0, -6)],
    body: `<p>Hold the ear over the band about 5 cm from the centre of the CORSAIR logo. Press straight down until both hooks <b>click</b> under the band's edges. To take it off, flex one side of the clip outward.</p>`,
    moves: [['ear_L', () => fin('ear_L'), 0.3, 1.1], ['insert_L', () => fin('insert_L'), 0.3, 1.1], ['clip_L', () => fin('clip_L'), 0.3, 1.1], ['click', 'L', 1.4, 0.8]] },
  { title: 'Repeat on the other side', cam: [W2V(-250, -300, 80), W2V(-60, 0, 10)],
    body: `<p>Same again with the RIGHT ear, its pink insert and the second clip, mirrored the same distance from the logo.</p>`,
    moves: [['ear_R', () => hov('ear_R', -85, 0, 0), 0, 1.2], ['insert_R', () => hov('insert_R', -85, -45, 0), 0, 1.2], ['insert_R', () => hov('insert_R', -85, 0, 0), 1.3, 0.8],
            ['clip_R', () => hov('clip_R'), 0.4, 1.2], ['ear_R', () => hov('ear_R'), 2.3, 1.3], ['insert_R', () => hov('insert_R'), 2.3, 1.3],
            ['ear_R', () => fin('ear_R'), 3.9, 1.0], ['insert_R', () => fin('insert_R'), 3.9, 1.0], ['clip_R', () => fin('clip_R'), 3.9, 1.0], ['click', 'R', 4.9, 0.8]] },
  { title: 'Done', cam: [W2V(390, -620, 150), W2V(0, 0, -95)],
    body: `<p>That's it. Drag to look around, or open the 3D viewer to see the finished ears up close.</p>`,
    moves: [] },
];

// glue drop and click ring
const glue = mk(new THREE.SphereGeometry(1.6, 24, 16), M.glue); glue.visible = false;
const ring = new THREE.Mesh(new THREE.TorusGeometry(24, 0.8, 12, 96), M.ring); world.add(ring); ring.visible = false;

// ---------------------------------------------------------------- state machine
let stepIdx = 0, t0 = 0, playing = false, camAnim = null;
function setPose(o, ps) { o.position.copy(ps.p); o.quaternion.copy(ps.q); o.scale.copy(ps.s); }
function endPoses(k) {   // pose of every part after step k has fully played
  const cur = {}; for (const n of PARTS) cur[n] = POSE[n].plate;
  for (let i = 0; i <= k; i++) for (const [n, f] of STEPS[i].moves) if (P[n] && f) cur[n] = f();
  return cur;
}
function startStep(k) {
  stepIdx = k; const prev = k > 0 ? endPoses(k - 1) : endPoses(-1);
  for (const n of PARTS) { setPose(P[n], prev[n]); P[n].userData.from = prev[n]; }
  glue.visible = false; ring.visible = false;
  t0 = performance.now(); playing = true;
  camAnim = { p0: cam.position.clone(), t0: ctl.target.clone(), p1: STEPS[k].cam[0].clone(), t1: STEPS[k].cam[1].clone(), s: performance.now() };
  if (MOBILE && cam.aspect < 1) { const s = 1.15 / cam.aspect; camAnim.p1 = camAnim.t1.clone().add(camAnim.p1.clone().sub(camAnim.t1).multiplyScalar(s)); }
  document.getElementById('stepNo').textContent = k === 0 ? 'Before you start' : `Step ${k} of ${STEPS.length - 2}`;
  if (k === STEPS.length - 1) document.getElementById('stepNo').textContent = 'Finished';
  document.getElementById('title').textContent = STEPS[k].title;
  document.getElementById('body').innerHTML = STEPS[k].body;
  document.getElementById('prev').disabled = k === 0; document.getElementById('next').disabled = k === STEPS.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === k));
  ctl.autoRotate = k === STEPS.length - 1; ctl.autoRotateSpeed = 0.7;
}
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
function tick(now) {
  if (camAnim) { const k = Math.min(1, (now - camAnim.s) / 1100), e = ease(k); cam.position.lerpVectors(camAnim.p0, camAnim.p1, e); ctl.target.lerpVectors(camAnim.t0, camAnim.t1, e); if (k >= 1) camAnim = null; }
  if (playing) {
    const t = (now - t0) / 1000; let busy = false;
    const from = {}; for (const n of PARTS) from[n] = P[n].userData.from;
    for (const [n, f, start, dur] of STEPS[stepIdx].moves) {
      const a = Math.max(0, Math.min(1, (t - start) / dur)); if (t < start + dur) busy = true;
      if (n === 'glue') { const side = 'L', o = META.origin[side]; const pz = offset({ p: V(...o), q: new THREE.Quaternion(), s: V(1, 1, 1) }, side, 0, 0, HOVER + 6.5);
        glue.visible = t > start && t < start + dur + 0.9; glue.position.copy(pz.p); glue.scale.setScalar(Math.min(1, a * 1.6)); continue; }
      if (n === 'click') { const o = META.origin[f]; ring.visible = a > 0 && a < 1; ring.position.set(...o); ring.quaternion.setFromUnitVectors(V(0, 0, 1), AX[f][2]);
        ring.scale.setScalar(0.6 + a * 0.9); M.ring.opacity = 0.9 * (1 - a); continue; }
      if (a <= 0) continue;
      const target = f(), src = from[n], e = ease(a);
      P[n].position.lerpVectors(src.p, target.p, e); P[n].quaternion.slerpQuaternions(src.q, target.q, e); P[n].scale.lerpVectors(src.s, target.s, e);
      if (a >= 1) from[n] = target;
    }
    for (const n of PARTS) P[n].userData.from = from[n];
    if (!busy && t > 0.2) playing = false;
  }
  ctl.update(); renderer.render(scene, cam);
}

// ---------------------------------------------------------------- load
const bytes = Uint8Array.from(atob('__GLB__'), c => c.charCodeAt(0));
new GLTFLoader().parse(bytes.buffer, '', (gl) => {
  const list = []; gl.scene.traverse(o => { if (o.isMesh) list.push(o); });
  for (const o of list) {
    const name = o.name || o.parent.name; let g = o.geometry; g.deleteAttribute('normal');
    g = toCreasedNormals(g, Math.PI / 5);
    const mat = name.startsWith('ear') ? M.ear : name.startsWith('clip') ? M.clip : name.startsWith('insert') ? M.insert : name.startsWith('anchor') ? M.anchor : M.band;
    const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; world.add(m);
    if (META.parts[name]) {
      P[name] = m;
      const F = new THREE.Matrix4().fromArray(META.parts[name].final), Pl = new THREE.Matrix4().fromArray(META.parts[name].plate);
      if (F.determinant() < 0) Pl.multiply(new THREE.Matrix4().makeScale(-1, 1, 1));   // mirrored clip: same shape, keep the sign so it never flattens mid-flight
      POSE[name] = { final: pose(F), plate: pose(Pl) };
    } else { o.updateWorldMatrix(true, false); m.applyMatrix4(o.matrixWorld); }
  }
  const dots = document.getElementById('dots');
  STEPS.forEach((_, i) => { const d = document.createElement('div'); d.className = 'dot'; d.onclick = () => startStep(i); dots.appendChild(d); });
  document.getElementById('loading').remove();
  cam.position.copy(STEPS[0].cam[0]); ctl.target.copy(STEPS[0].cam[1]);
  startStep(0);
});
document.getElementById('next').onclick = () => startStep(Math.min(STEPS.length - 1, stepIdx + 1));
document.getElementById('prev').onclick = () => startStep(Math.max(0, stepIdx - 1));
document.getElementById('replay').onclick = () => startStep(stepIdx);
addEventListener('keydown', e => { if (e.key === 'ArrowRight') document.getElementById('next').click(); if (e.key === 'ArrowLeft') document.getElementById('prev').click(); });
function size() { renderer.setSize(innerWidth, innerHeight, false); cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); }
addEventListener('resize', size); size();
renderer.setAnimationLoop(tick);
window.__step = startStep;
</script>
</body>
</html>
